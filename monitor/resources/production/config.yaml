checks:
  - name: Broadridge Net Down
    detail: Broadridge is unreachable
    fluxfile: flux/bfs_net_down.flux
    severity: 1
    threshold: 1
    calendar: OfficeHours 
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
      - server
      - port 
      - service
    interval: 300
    target: xapi
    action: | 
              Although BFS occassionally flaps, any extended outage may prevent file transfers and MQ messaging.
              Login to manually verify that network is recovered. If not open and incident for Azure Network Support.
              The service tested is TCP port 1364 on 149.83.1.11
  - name: BPSA Excessive Queue Length
    detail: The BPSA MQ Queue has more than 10000 outstanding messages exceeding the alert threshold
    fluxfile: flux/bpsa_queue_length.flux
    severity: 1
    threshold: 10000
    comparison: ge
    tags: 
      - host
      - _field
      - _measurement
      - queue
    interval: 120
    target: xapi
    action: | 
              A large number of outstanding messages indicates that either the number of incoming messages is exceptionally large
              or there is a significant problem with processing. Use the Azure Portal Dashboard for BPSA to compare incoming
              message rates with outgoing. Unless there is exception volume (RRSP season) it is most likely the loss of a WLS 
              or a problem with database performnce. Ensure the WLS managed servers are healthy and engage a DBA to look at 
              Oracle stats.
  - name: Cannot Submit CFG.USCMUserSync
    detail: The CFG.USCMUserSync job cannot be submitted. This is a user sync failure.
    calendar: OfficeHours
    fluxfile: flux/cannot_submit.flux
    severity: 1
#    match: CFG.USCMUserSync
#    comparison: substr
# The flux return a count of matching lines
    threshold: 0.0
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 300
    target: xapi
    action: | 
              A user sync failure has occurred in the job that synchronizes users betweemn USCM and Config. This may require a 
              rolling restart of Weblogic managed servers. 
  - name: Unusual Data Volume change
    detail: Looks for differences between daily data volume changes
    fluxfile: flux/data_volume_change.flux
    severity: 1
    threshold: 0
    comparison: gt 
    tags: 
      - host
      - _field
      - _measurement
      - path
    interval: 3600
    target: postfix
    action: |
              There is a significant difference in the change of data volumes from on day to the next. This may indicate that 
              there is a problem with a process, an unusually large file creation or human error. Inpect the server and 
              volume manually to see what has changed dramatically in the last 24h. For example, use a "find -mtime -1" and look
              for any suspiciously large files. This is not criital. 

  - name: Dummy Test Error xMatters
    detail: Checks for the existence of a dummy file to veryfy alert targets are functioning IGNORE THIS ALERT
    fluxfile: flux/dummy_error.flux
    severity: 1
    threshold: 0
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 60
    target: xapi
    action: Do nothing. This is a sythetic error to allow xMatters alert testing. 
  - name: Dummy Test Error Postfix
    detail: Checks for the existence of a dummy file to veryfy alert targets are functioning IGNORE THIS ALERT
    fluxfile: flux/dummy_error.flux
    severity: 1
    threshold: 0
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 60
    target: postfix
    action: Do nothing. This is a sythetic error to allow postfix email alert testing. 
  - name: Feedhub Net Down
    detail: Feedhub is unreachable
    fluxfile: flux/feedhub_net_down.flux
    severity: 1
    threshold: 1
    calendar: OfficeHours 
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
      - server
      - port 
      - service
    interval: 300
    target: xapi
    action: | 
              This indicates that Feedhub is not reachable from one or more servers. This may be a temporary disruption of traffic. 
              Log into the affected VM and manually test connectivity. An extended failure to connect or repeated alerts should be
              escalated to Azure Network Support and/or the client. Feedhub uses port 22 on IP adresses: 168.108.161.83 (MCC) and
              168.108.225.214 (SCC)
  - name: Fundserv Net Down
    detail: The MQ endpoint at Fundserv on 142.148.10.116 port 1501 is unreachable
    fluxfile: flux/fundserv_mq_net_down.flux
    severity: 1
    threshold: 1
    calendar: Fundserv
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
      - server
      - port
      - service
    interval: 300
    target: xapi
    action: | 
              This alert indicates that several attempts to connect by TCP to the endpoint in the details failed. This may be a
              temporary problem but connectivity should be verified manually. Extended outages should be escalated to Azure
              Network Support and/or the client. This alert may be accompanied by MQ alerts. An extended outage may require
              MQ channels to be restarted. Verify manually 142.148.10.116 port 1501 is reachable.
  - name: Fundserv Net Down
    detail: The MQ endpoint at Fundserv on 142.148.10.120 port 2222 is unreachable
    fluxfile: flux/fundserv_net_down.flux
    severity: 1
    threshold: 1
    calendar: Fundserv
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
      - server
      - port
      - service
    interval: 300
    target: xapi
    action: | 
              This alert indicates that several attempts to connect by TCP to the endpoint in the details failed. This may be a
              temporary problem but connectivity should be verified manually. Extended outages should be escalated to Azure
              Network Support and/or the client. Verify manually 142.148.10.120 port 2222 is reachable.
  - name: HAProxy Backend Down
    detail: checks for a non-zero connection failure rate from HAProxy to backend servers.
    calendar: OfficeHours
    fluxfile: flux/haproxy_downtime_rate.flux
    severity: 1
    threshold: 0.0
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
      - proxy
      - sv
    interval: 120 
    target: xapi
    action: | 
              This alert indicates that the load-balancer cannot establish a connection to the backends on WLS servers. 
              Connect to any affected Weblogic server and Weblogic console. Manually check that the applications are up and look at 
              logs for any errors that would indicate that one or more products are non-operational.  
              Look for excessive load on Azure Portal dashboards (CPU). This alert may be sent during simple high load but 
              most llkely a WLS Node has a fault and will need to be restarted.
  - name: Intact IntactPollerEJBBean Error
    detail: The IntactPollerEJBBean has produced an ERROR level log alert
    fluxfile: flux/intact_bean_check.flux
    severity: 1
    threshold: 0
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 300
    target: xapi
    action: | 
              Call Mr. Azzopardi.
  - name: IRESS Net Down
    detail: IRESSS is unreachable
    fluxfile: flux/iress_net_down.flux
    severity: 1
    threshold: 1
    calendar: OfficeHours
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
      - server
      - port 
      - service
    interval: 300
    target: xapi
    action: | 
              This alert indicates that several attempts to connect by TCP to the endpoint in the details failed. This may be a
              temporary problem but connectivity should be verified manually. Extended outages should be escalated to Azure
              Network Support and/or the client. This alert may be accompanied by MQ alerts. An extended outage may require
              MQ channels to be restarted. The services are on TCP ports 17485-8 on IP 208.77.94.31
  - name: JVM Heap Usgage
    detail: The JVM Heap usage has exceeded the 95 percent threshold
    fluxfile: flux/jvm_heap_use.flux
    severity: 1
    threshold: 0.95
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 180
    target: xapi
    action: | 
              This alert indicates that the affected WLS Managed Server is suffering some kind of memory leak. 
              The managed server will most likely need to be restarted. 
  - name: JVM Stuck Thread 
    detail: The stuck thread count exceeds a threshold
    fluxfile: flux/jvm_stuck_thread.flux
    severity: 1
    threshold: 0
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
      - wls_ServerRuntime
    interval: 120
    target: xapi
    action: | 
              This alert indicates that the affected WLS Managed Server is suffering from a locking issue, possible deadlock. 
              The managed server will most likely need to be restarted. 
  - name: MQ Channel Down - Fundserv
    detail: There is a status other than OK/Running on Fundserv MQ Channel
    fluxfile: flux/mqchan_fs_stat.flux
    severity: 1
    threshold: 0
    calendar: Fundserv
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 300
    target: xapi
    action: | 
              Log in to the MQ server and check the channel status. Verify that the remote MQ server is reachable on the MQ port.
              Attempt to reset any unhealthy channel(s). User netstat (or ss) to check for any connections in an unusual state.
              If there is an underlying network problem escalate to Azure Network Support and the client.
