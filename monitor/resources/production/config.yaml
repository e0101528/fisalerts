              If there is an underlying network problem escalate to Azure Network Support and the client.
  - name: MQ Channel Down - IRESS
    detail: There is a status other than OK/Running on IRESS MQ Channel
    calendar: OfficeHours
    fluxfile: flux/mqchan_iress_stat.flux
    severity: 1
    threshold: 0
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 300
    target: xapi
    action: | 
              Log in to the MQ server and check the channel status. Verify that the remote MQ server is reachable on the MQ port.
              Attempt to reset any unhealthy channel(s). User netstat (or ss) to check for any connections in an unusual state.
              If there is an underlying network problem escalate to Azure Network Support and the client. The remote MQ server
              is on TCP port 17516 on IP 208.77.94.31
  - name: No Job Control Record
    detail: checks for the presence of job control error messages
    fluxfile: flux/no_job_record.flux
    severity: 1
    threshold: 0
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 120
    target: xapi
    action: |
              Call Mr. Azzopardi. 
  - name: Path Service Not Available
    detail: The path service not available message is in the Admin Log. This indicates a serious Weblogic Issue. 
    calendar: OfficeHours
    fluxfile: flux/path_unavailable.flux
    severity: 1
#    match: path service not available
#    comparison: substr
# flux return count of matching strings not  a string to match..
    threshold: 0.0
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 300
    target: xapi
    action: | 
              There is a serious problem with the Weblogic cluster. 
              Log in to the WLS server and the Weblogic console. Check the health of the services and singleton. 
              Escalate. This will most likely require a rolling restart of the Weblogic cluster. 
  - name: Reuters Net Down
    detail: Reuters is unreachable
    fluxfile: flux/reuters_net_down.flux
    severity: 1
    threshold: 0
    calendar: OfficeHours
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
      - server
      - port 
      - service
    interval: 300
    target: xapi
    action: | 
              This alert indicates that several attempts to connect by TCP to the endpoint in the details failed. This may be a
              temporary problem but connectivity should be verified manually. Extended outages should be escalated to Azure
              Network Support and/or the client. Reuters is reached through the CIBC network and may indicate a more serious loss 
              of connectivity. 
  - name: Idle Min
    detail: Checks for minimum CPU Idle below a 5% threshold for 80% of metrics
    fluxfile: flux/usage_idle.flux
    severity: 1
    threshold: 8
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 600
    target: postfix
    action: | 
              This alert indicates and unusual and extended period during which the affected VM saw very low CPU Idle time. 
              It does not indicate the CPU activity, only unusual load. Use Influx/Grafana dashboards or Azure metrics to 
              investigate the type of CPU usage and log into the VM to look for top or iotop processes that may be malfunctioning. 
  - name: IOWait Max
    detail: Minimum IOWait has exceeded a 25% CPU threshold for over 5 mins
    calendar: OfficeHours
    fluxfile: flux/usage_iowait.flux
    severity: 1
    threshold: 25 
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 300
    target: postfix
    action: | 
              An extended period of extremely high I/O during normal working hours indicates unusal activity, a defective process or
              a problem with underlying storage. The BPSA dashboard can indicate problems on the Netapp storage. VM metrics can be
              used to ascertain if there is a sudden and unusal spike in disk activity. Login and use iotop and iostat to find
              the process and storage volume affected. I/O wait may also occur on network connections. Check on the health
              of the database servers. Use the Azure portal to look for any events associated with the resource affected. 
  - name: CPU User Max
    detail: Mean User time has exceeded a 95% CPU threshold for over 5 mins
    calendar: OfficeHours
    fluxfile: flux/usage_user.flux
    severity: 1
    threshold: 95 
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 300
    target: postfix
    action: | 
              An extended period of extremely high CPU User time indicates unusal activity or a defective process. VM metrics 
              can be used to ascertain if there is a sudden and unusal spike in such activity. Login and use top to find
              the process causing the spike. If Weblogic or Oracle DB are implicated, there may be underlying hardware or
              configuration issues. Look at historical activity for patterns. Escalate. 
  - name: Volume Usage
    detail: Check for per mountpoint volume percent used threshold exceeds 80% 
    fluxfile: flux/volume_usage.flux
    severity: 1
    threshold: 90
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
      - path
    interval: 900
    target: xapi
    action: | 
              Login and attempt to clean up the volume. If this is a system volume, escalate to a user with root access. 
  - name: JMS Queue Usgage
    detail: The JMS queue length has exceeded 2000 outstanding messages
    fluxfile: flux/wl_jms_queue.flux
    severity: 1
    threshold: 2000
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 120
    target: xapi
    action: | 
              Unusual JMS queue length may indicate unusual volume or a more serious, unerlying performance problem. 
              If messages are accumulating escalate immediately. If messages are flowing but with a large but stable backlog
              there is more time for diagnostics. The issue may resolve itself when incoming volume declines. However you should
              use Azure Dashboards and Influx/Grafana to attempt to find any historically unusual load. Since the processing
              depends upon webogic, persistent storage, database and network, collecting diagnostics during an event can assist
              with later analysis. Check weblogic logs for errors.
  - name: Weblogic Socket Open Count
    detail: The socket count for weblogic has exceeded a threshold of 850
    fluxfile: flux/wl_open_sock.flux
    severity: 1
    threshold: 850
    comparison: gt
    tags: 
      - host
      - _field
      - _measurement
    interval: 120
    target: xapi
    action: | 
              High open socket counts can indicate a defective weblogic server. It may also indicate unusual and protential serious
              activity. Look at haproxy stats for new connections. If that is unusally high, attempt to collect source IP addresses.
              If the incoming load seems normal, then the high count indicates that weblogic is unable to service the connections
              fast enough. If this occurs on a single weblogic node, then it may need to be restarted. If more than one node
              is affected then a cluster-wide issue is present. That may be persistent storage, network or database. 
